name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  GOLANGCI_VERSION: v1.64.8
  SWAG_VERSION: v1.16.6

jobs:
  test:
    name: Lint, Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@${{ env.SWAG_VERSION }}

      - name: Lint
        run: golangci-lint run ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: go build -o /tmp/server ./cmd/api && go build -o /tmp/migrate ./cmd/migrate

      - name: Generate Swagger
        run: swag init -g cmd/api/main.go -o ./docs --parseDependency --parseInternal

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dsmes-backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=,format=long
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Verify production image tag
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dsmes-backend
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_TAG: ${{ github.sha }}
        run: |
          printf '%s\n' "$IMAGE_TAGS"
          printf '%s\n' "$IMAGE_TAGS" | grep -Fx "$IMAGE_NAME:$EXPECTED_TAG"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Production to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install production compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p ~/dsmes/backend'
          scp docker-compose.production.yml "$VPS_USER@$VPS_HOST:~/dsmes/backend/"

      - name: Login to GHCR on VPS
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" \
            'docker login ghcr.io -u hidayattt24 --password-stdin'

      - name: Deploy and verify backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE_SCRIPT'
          set -eu
          cd ~/dsmes/backend
          compose='docker compose -f docker-compose.production.yml'
          previous_image=$(docker inspect --format '{{.Config.Image}}' dsmes_backend 2>/dev/null || true)
          previous_tag=${previous_image##*:}

          BACKEND_TAG="$IMAGE_TAG" $compose pull
          BACKEND_TAG="$IMAGE_TAG" $compose up -d --remove-orphans

          healthy=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo 'Deployment health check failed.'
            echo 'Current container status:'
            docker ps -a --filter name=dsmes_backend
            docker inspect dsmes_backend 2>/dev/null || true
            docker logs --tail=200 dsmes_backend 2>&1 || true

            if [ -n "$previous_tag" ] && [ "$previous_tag" != "$IMAGE_TAG" ]; then
              echo "Rolling back application image to $previous_tag"
              BACKEND_TAG="$previous_tag" $compose up -d --remove-orphans || true
            else
              echo 'No previous tagged image was available for rollback.'
            fi
            exit 1
          fi

          echo "Backend deployment succeeded with image tag $IMAGE_TAG"
          REMOTE_SCRIPT


