name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  GO_VERSION: "1.26"
  GOLANGCI_VERSION: v1.64.8
  SWAG_VERSION: v1.16.6

jobs:
  test:
    name: Lint, Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@${{ env.SWAG_VERSION }}

      - name: Lint
        run: golangci-lint run ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: go build -o /tmp/server ./cmd/api && go build -o /tmp/migrate ./cmd/migrate

      - name: Generate Swagger
        run: swag init -g cmd/api/main.go -o ./docs --parseDependency --parseInternal

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dsmes-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
